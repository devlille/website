name: Deploy to CleverCloud

on:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Check types
        run: pnpm run check

      - name: Build site
        run: pnpm run build

      - name: Run SEO checks
        run: pnpm run test:seo

      - name: Install CleverCloud CLI
        run: pnpm add -g clever-tools

      - name: Deploy to CleverCloud
        env:
          CLEVER_TOKEN: ${{ secrets.CLEVER_TOKEN }}
          CLEVER_SECRET: ${{ secrets.CLEVER_SECRET }}
        run: |
          clever link ${{ secrets.CLEVER_APP_ID }}
          clever restart --without-cache
