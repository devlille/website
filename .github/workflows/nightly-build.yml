name: Manual CleverCloud Deploy

on:
  workflow_dispatch:
  schedule:
    # Toutes les 15 min, décalé hors des minutes rondes (:00/:15/:30/:45)
    # pour éviter les pics de charge GitHub où les schedules sont sautés/retardés.
    - cron: "7,22,37,52 * * * *"

jobs:
  deploy:
    uses: ./.github/workflows/deploy-clevercloud.yml
    secrets: inherit
